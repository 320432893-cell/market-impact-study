# 脚本型仓库闸集:detect-secrets / semgrep / 工具契约 / changed-file ruff / dependency approval / pip-audit(manual)
# 设计原则：
#   - detect-secrets 与项目依赖无关 → 用 pre-commit 隔离 env (repo: 模式)
#   - semgrep / pip-audit 跑项目 .venv 里的固定 dev 依赖，避免 uvx 临时解析/缓存
#   - detect-secrets 版本钉死(rev); semgrep/pip-audit 走项目 venv
#   - pip-audit 需要解析依赖漏洞库，默认放 manual 阶段；CI 中固定执行
#   - ruff 全量和格式仍是历史基线工具；默认只阻塞 staged Python 文件的新增 lint 问题，避免旧账阻塞提交

repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.15.13
    hooks:
      - id: ruff-check
        stages: [manual]
      - id: ruff-format
        stages: [manual]

  - repo: https://github.com/Yelp/detect-secrets
    rev: v1.5.0
    hooks:
      - id: detect-secrets
        args: ["--baseline", ".secrets.baseline"]
        exclude: |
          (?x)^(
            uv\.lock|
            \.secrets\.baseline|
            \.ai-config/config/settings\.json\.template
          )$

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: check-added-large-files
        args: ["--maxkb=51200"]  # 本仓库含研究数据(最大46M),数据即资产随仓走
      - id: check-json
      - id: check-yaml
      - id: check-toml
      - id: end-of-file-fixer
      - id: trailing-whitespace

  - repo: local
    hooks:
      - id: python-compile
        name: python compile smoke check
        entry: python3 tools/check.py python-compile
        language: system
        pass_filenames: false
        types: [python]

      - id: coverage-audit
        name: code directory quality-gate coverage audit
        entry: python3 tools/check.py coverage-audit
        language: system
        pass_filenames: false
        types: [python]


      - id: ruff-staged
        name: ruff staged Python files
        entry: python3 tools/check.py ruff-staged
        language: system
        pass_filenames: false
        types: [python]


      - id: lifecycle
        name: lifecycle debt (临时件/别名缺机器可读过期)
        entry: python3 tools/check.py lifecycle-changed
        language: system
        pass_filenames: false
        # 只卡新增/改动的临时件缺 expires;full sweep 在 CI 跑(非阻塞 WARNING)
        types: [python]


      - id: rule-tool-contracts
        name: rule/tool contract check
        entry: python3 tools/check.py rule-tool-contracts
        language: system
        pass_filenames: false
        files: ^(\.ai-config/.*|\.semgrep/.*|\.github/workflows/ci\.yml|\.pre-commit-config\.yaml|\.ruff\.toml|\.importlinter|tools/check\.py|pyproject\.toml|uv\.lock)$

      - id: dependency-change-approval
        name: dependency/lock change approval gate
        entry: python3 tools/check.py dependency-change-approval
        language: system
        pass_filenames: false
        files: ^(pyproject\.toml|uv\.lock)$

      - id: semgrep
        name: semgrep (project static guardrails)
        entry: python3 tools/check.py semgrep
        language: system
        pass_filenames: false
        files: ^(.+\.py|app/templates/.+\.html|\.semgrep/.+\.ya?ml)$

      - id: pip-audit
        name: pip-audit (dependency vulnerabilities)
        entry: python3 tools/check.py pip-audit
        language: system
        pass_filenames: false
        stages: [manual]
